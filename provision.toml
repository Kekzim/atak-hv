# ---------------------------------------------------------------------
# Extra adb shell-kommandon, korda som en del av nedlasningen.
#
# Bluetooth ar AVSIKTLIGT inte avstangt har. Pa en enskild enhet utan
# tillbehor ar "svc bluetooth disable" en rimlig besparing, men
# payload/atak/tools/bluetooth/bluetooth_devices.xml konfigurerar
# laseravstandsmatare (PLRF, MOSKITO, Vector21, TruePulse) och externa
# GNSS-mottagare (Bad Elf, Trimble R8/R10/R12). Stanger ni av Bluetooth
# slutar de fungera.
#
# Anvander ni inga Bluetooth-tillbehor, lagg till:
#     install = [["svc", "bluetooth", "disable"]]
#     restore = [["svc", "bluetooth", "enable"]]
# ---------------------------------------------------------------------
[commands]
install = []
restore = []

# ---------------------------------------------------------------------
# Appar som ska finnas fore korning, installerade fran Google Play.
#
# Verktyget kontrollerar dem forst av allt och avbryter om nagot under
# [requirements.required] saknas - det ar ingen ide att pusha
# konfiguration till en telefon som inte har ATAK.
#
# Saknas nagot under [requirements.optional] blir det en varning, ingen
# avbrytning. Ta bort rader ni inte anvander.
#
# Paketnamnen ar verifierade mot en testenhet dar det gick; ovriga ar
# leverantorernas standardnamn. Kontrollera med:
#     adb shell pm list packages | grep -i <namn>
# ---------------------------------------------------------------------
# Appar som redan maste finnas pa enheten. Poster som sidladdas ur
# payload/apks hoppas over automatiskt - verktyget jamfor mot
# paketnamnen i katalogen - sa listan behover inte rensas nar en app
# borjar folja med i paketet.
[requirements.required]
"com.atakmap.app.civ" = "ATAK-CIV (Civil Use)"

[requirements.optional]
"com.atakmap.android.datasync.plugin" = "ATAK Plugin: Data Sync"
"com.atakmap.android.geocam.plugin" = "ATAK Plugin: GeoCam"

# ---------------------------------------------------------------------
# Rattigheter for appar som installeras fran Google Play.
#
# De sidladdade apparna far allt via "adb install -g". ATAK kommer fran
# Play Store och far ingenting - darfor beviljas rattigheterna har i
# stallet for att lita pa att operatoren trycker ratt i alla dialoger.
#
# ACCESS_BACKGROUND_LOCATION ar den viktiga: utan den rapporterar ATAK
# position bara i forgrunden, sa Blue Force Tracking slutar fungera nar
# skarmen slacks. Den gar inte att fa via de vanliga dialogrutorna - den
# kraver ett separat besok i Installningar.
#
# Rattigheter som appen inte deklarerar, eller som inte finns i den
# Android-versionen, hoppas over utan att raknas som fel.
# ---------------------------------------------------------------------
[permissions]
"com.atakmap.app.civ" = [
    # plats - FINE och COARSE forst, BACKGROUND kraver att de finns
    "android.permission.ACCESS_FINE_LOCATION",
    "android.permission.ACCESS_COARSE_LOCATION",
    "android.permission.ACCESS_BACKGROUND_LOCATION",
    # kamera, mikrofon och media
    "android.permission.CAMERA",
    "android.permission.RECORD_AUDIO",
    "android.permission.READ_MEDIA_IMAGES",
    "android.permission.READ_MEDIA_VIDEO",
    "android.permission.READ_MEDIA_AUDIO",
    "android.permission.ACCESS_MEDIA_LOCATION",
    "android.permission.READ_EXTERNAL_STORAGE",
    "android.permission.WRITE_EXTERNAL_STORAGE",
    # radio och natverk - LRF, externa GNSS, wifi-upptackt
    "android.permission.BLUETOOTH_CONNECT",
    "android.permission.BLUETOOTH_SCAN",
    "android.permission.BLUETOOTH_ADVERTISE",
    "android.permission.NEARBY_WIFI_DEVICES",
    # aviseringar och telefonistatus
    "android.permission.POST_NOTIFICATIONS",
    "android.permission.READ_PHONE_STATE",
]

# "All files access" - kravs for att komma at /sdcard/atak.
# Satts med appops, inte pm grant.
[appops]
"com.atakmap.app.civ" = [["MANAGE_EXTERNAL_STORAGE", "allow"]]

# Undantag fran batterioptimering. Utan det stryper Doze
# positionsrapportering och serversynk i bakgrunden.
[battery]
exempt = ["com.atakmap.app.civ"]

# ---------------------------------------------------------------------
# ATAK-preferenser som laggs ut vid installationen.
#
# ATAK laser <mount>/atak/config/prefs/defaults nar appen startar,
# tillampar varje post och raderar sedan filen. Det ar ATAK:s egen vag
# att masskonfigurera enheter - ATAKActivity anropar
# PreferenceControl.ingestDefaults() tidigt i uppstarten.
#
# Filen skrivs av verktyget, eftersom anropssignalen ar unik per telefon
# och darfor inte kan ligga i payload/atak, som ar samma for alla.
#
# Steget hinner fore ATAK:s egen ifyllning: ATAK hittar bara pa en
# anropssignal nar locationCallsign ar tomt, och defaults lases in innan
# dess.
# ---------------------------------------------------------------------
[prefs]
target = "/sdcard/atak/config/prefs/defaults"
# Fardiga preferensuppsattningar som kopieras in i defaults-filen.
# Innehallet tillampas vid start som allt annat, sa operatoren slipper
# importera dem for hand pa varje telefon.
#
# Grund och Planering ar ATAK-loadouts: vilka knappar som visas i
# verktygsraden och vilka verktyg som doljs. Grund ar den avskalade
# soldatvyn, Planering behaller planeringsverktygen.
#
# Filerna ligger kvar under payload/ATAK-installation/ och foljer darmed
# med ut pa telefonen, sa de gar att importera for hand ocksa om nagon
# vill byta loadout i efterhand.
include = [
    "payload/ATAK-installation/Grund.zip",
    "payload/ATAK-installation/Planering.zip",
]

# Vilken loadout som ska vara vald nar ATAK startar. Att importera en
# loadout gor den bara tillganglig - ATAK minns den valda separat.
#
# Anges med titel, inte UID. UID:t byts varje gang loadouten exporteras
# om, och lases darfor ur filen. Star har en titel som inte finns bland
# filerna ovan avbryts steget i stallet for att tyst lamna fel vy.
# Kommentera bort raden for att lata operatoren valja sjalv.
select_loadout = "Grund"
# Preferensgruppen posterna skrivs i. ATAK mappar om det har namnet till
# appens egna preferenser vid inlasning.
group = "com.atakmap.app_preferences"
# Poster som fragas efter vid korningen. De ar unika per telefon och kan
# darfor inte ligga under [prefs.entries], som ar samma pa alla enheter.
# `flag` ar flaggan som anger vardet i forvag; utan flagga fragas det
# bara efter interaktivt. Tomt svar hoppar over posten.
#
# Teamfarg och roll fragas det med avsikt inte efter. De har manga
# alternativ och satts av anvandaren i ATAK efter forsta uppstarten.
[[prefs.ask]]
key = "locationCallsign"
flag = "callsign"
prompt = "Anropssignal (enligt FAL-A)"

# Nivataggen som hogre staber filtrerar pa, t.ex. #Bat, #Komp, #Plut,
# #Grp. Hamnar i CoT-meddelandets remarks-falt.
[[prefs.ask]]
key = "userRemarks"
flag = "remarks"
prompt = "Remarks (nivatagg)"

# Kritiska enhetsinstallningar ur handboken: MGRS, MSL, meter, km/h,
# numerisk kurs, streck och gitternord. "Avvikelser skapar kritiska fel
# vid eldledning", sa de ska vara lika pa alla enheter och sattas har i
# stallet for att knappas in per telefon.
#
# VARDENA AR STRANGAR aven nar de ser ut som siffror. ATAK:s
# ListPreference lagrar dem som String och gor Integer.parseInt() vid
# lasning - skrivs de som heltal kastar appen ClassCastException.
# Typen foljer TOML: "1" ger String, 1 ger Integer, true ger Boolean.
[prefs.entries]
coord_display_pref = "MGRS"        # koordinatformat
alt_display_pref = "MSL"           # hojd over havet, inte ellipsoid
alt_unit_pref = "1"                # 0 = fot, 1 = meter
speed_unit_pref = "1"              # 0 = mph, 1 = km/h, 2 = knop, 3 = m/s
compass_heading_display = "Numeric"  # numerisk kurs, inte vaderstreck
rab_brg_units_pref = "1"           # 0 = grader, 1 = streck (mils)
rab_north_ref_pref = "2"           # 0 = rattvisande, 1 = magnetisk, 2 = gitternord

# ---------------------------------------------------------------------
# Doze-undantag som kontrolleras (aldrig andras).
#
# Blue Force Tracking kraver bakgrunds-GPS och natverk. Ar ATAK inte
# undantagen fran Doze stryps positionsrapporteringen. Verktyget varnar
# om undantaget saknas.
# ---------------------------------------------------------------------
[doze]
verify = ["com.atakmap.app.civ"]

# ---------------------------------------------------------------------
# Restore behaviour
# ---------------------------------------------------------------------
[restore]
# Packages whose name contains any of these are uninstalled.
# Match against the package id, not the app's display name - Signal
# ships as org.thoughtcrime.securesms, so "signal" alone never matched
# it (a long-standing bug in the old .bat scripts).
uninstall_match = [
    "atak",
    "geocam",
    "securesms",   # Signal
]

# Never uninstalled, even on a match - stops a broad substring like
# "atak" from taking out a system component.
protected_prefixes = ["android", "com.android.", "com.google.android."]

# Removed by `restore`.
remove_paths = [
    "/sdcard/atak",
    "/sdcard/ATAK-installation",
    "/sdcard/Download/atak-box.zip",
]

# Removed only by `restore --wipe-media`. User data - not reversible.
wipe_paths = [
    "/sdcard/Download/*",
    "/sdcard/DCIM/*",
    "/sdcard/Pictures/*",
    "/sdcard/Documents/*",
]
