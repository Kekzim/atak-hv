# OxygenOS-appar och telemetri. Utprovat pa OnePlus Nord N100 (BE2013).
#
# ORORDA med avsikt: com.oneplus.coreservice, com.oneplus.security,
# com.oneplus.config, com.oneplus.*overlay.*, com.oneplus.sdcardservice,
# com.oneplus.providers.media, com.oneplus.dataoptimization - OS-niva for
# tema, lagring och natverk. Att stanga av dem riskerar Installningar,
# lagringsatkomst och wifi.
# Diagnostik, fabrikstestverktyg och telemetri. Ingen av dem har nagon
# funktion for anvandaren; flera har natverksrattigheter. net.oneplus.odm
# och .push lag bland de storsta CPU-konsumenterna pa en vilande enhet.
# Provat pa BE2013: telefonen, ATAK, wifi och GPS opaverkade.
#
# Backup, konton och ansiktslasning ar meningslosa pa en enhet utan
# Google- eller OnePlus-konto, och lasupplasning sker med PIN.
#
# ORORDA med avsikt: com.oneplus.accessory, com.oneplus.geoiptime och
# com.oneplus.carrierlocation ror tillbehor, tid och position - tre saker
# den har enheten inte har rad att fa fel. com.oneplus.camera,
# .filemanager och .screenshot behover operatoren. Alla *overlay*-paket
